worker_processes auto;
pid /tmp/skyvern-nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    # Never log query strings: browser streaming authenticates using query credentials.
    log_format safe '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout safe;
    # Recover the real client address from an HTTPS edge proxy on a private/Docker network, so login
    # throttling is per client. Forwarded headers from public sources are ignored.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_x_forwarded_proto $public_scheme { default $scheme; https https; }
    server {
        listen 80;
        server_name _;
        client_max_body_size 100m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        location = /healthz {
            proxy_pass http://127.0.0.1:8000/api/v1/heartbeat;
        }
        location = /_admin_check {
            internal;
            proxy_pass http://127.0.0.1:8080/auth/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $http_host;
        }
        # These local-only diagnostics otherwise see the proxy as a trusted localhost client.
        location ~ ^/(api/)?v[12]/internal(/|$) {
            auth_request /_admin_check;
            proxy_pass http://127.0.0.1:8000;
        }
        location ~ ^/(api/)?v[12](/|$) {
            proxy_pass http://127.0.0.1:8000;
        }
        location ~ ^/(docs|redoc|openapi.json)(/|$) {
            proxy_pass http://127.0.0.1:8000;
        }
        # Artifact requests pass through the admin gate in the UI server.
        location / {
            proxy_pass http://127.0.0.1:8080;
        }
    }
}
